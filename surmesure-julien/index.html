<script>
/* Auto-réparation : purge les anciennes versions en mémoire, une seule fois */
(function(){var V='11';try{if(localStorage.getItem('tmv')===V)return;localStorage.setItem('tmv',V)}catch(_){return}
var p=[];if(navigator.serviceWorker)p.push(navigator.serviceWorker.getRegistrations().then(function(r){return Promise.all(r.map(function(x){return x.unregister()}))}));
if(window.caches)p.push(caches.keys().then(function(k){return Promise.all(k.map(function(x){return caches.delete(x)}))}));
Promise.all(p).then(function(){location.reload()})})();
</script>
<script src=moteur.js?v=11></script><script src=app.js?v=11></script></body></html>
